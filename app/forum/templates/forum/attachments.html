{% if not item.deleted %}<div class="attachments">{% for image in item.image_rows %}<a href="{% url 'attachment' image.pk %}"><img src="{% url 'attachment' image.pk %}" loading="lazy" alt="Attached image"></a>{% endfor %}</div>{% if can_attach %}<details class="upload"><summary>Attach image</summary><form method="post" action="{% url route item.pk %}" enctype="multipart/form-data">{% csrf_token %}<label for="image-{{ route }}-{{ item.pk }}">PNG, JPEG or WebP · up to 5 MiB</label><input id="image-{{ route }}-{{ item.pk }}" type="file" name="file" accept="image/png,image/jpeg,image/webp" required><button>Upload image</button></form></details>{% endif %}{% endif %}
