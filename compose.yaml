services:
  app:
    build: .
    environment:
      WE_SPEAK_SECRET_KEY: ${WE_SPEAK_SECRET_KEY:?Generate a private .env first}
      WE_SPEAK_HOSTS: ${WE_SPEAK_HOSTS:-localhost}
      WE_SPEAK_TRUST_PROXY: "1"
    volumes:
      - forum-data:/data
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  proxy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      WE_SPEAK_SITE: ${WE_SPEAK_SITE:-localhost}
    ports:
      - "${WE_SPEAK_BIND:-127.0.0.1}:${WE_SPEAK_HTTP_PORT:-8089}:80"
      - "${WE_SPEAK_BIND:-127.0.0.1}:${WE_SPEAK_HTTPS_PORT:-8449}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private, edge]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
networks:
  private:
    internal: true
  edge: {}
volumes:
  forum-data: {}
  caddy-data: {}
  caddy-config: {}
